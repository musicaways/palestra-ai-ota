name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      # su push e PR si aprono 20 brani del catalogo (tutti i 600+ richiedono troppo tempo);
      # l'avvio manuale del workflow li apre tutti
      - run: npm run test:e2e
        env:
          GST_QUICK: ${{ github.event_name != 'workflow_dispatch' && '1' || '' }}
