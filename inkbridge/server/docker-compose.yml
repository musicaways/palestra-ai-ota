# Da lanciare sul NAS, accanto a Calibre e Suwayomi.
#   cp .env.example .env && nano .env && docker compose up -d
services:
  inkbridge:
    build: .
    # In alternativa: image: ghcr.io/<utente>/inkbridge:1.0.0
    container_name: inkbridge
    restart: unless-stopped
    ports:
      - "8577:8577"
    env_file: .env
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8577/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
